name: Feature request
description: Suggest a SQL.FM feature, reference, or usability improvement.
title: "[Feature request] "
labels:
  - enhancement
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like SQL.FM to add or change?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?

  - type: textarea
    id: examples
    attributes:
      label: Examples or references
